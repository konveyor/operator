# A collection groups skills so an Agent can reference them in one line.
# Grouping is separate from packaging: plan and javaee-to-quarkus come out of
# the same image, house-rules has no image at all, and the collection neither
# knows nor cares.
apiVersion: konveyor.io/v1alpha1
kind: SkillCollection
metadata:
  name: java-migration-skills
  labels:
    app.kubernetes.io/managed-by: agentic-controller-defaults
spec:
  version: "2.0.0"
  skills:
    - name: plan
      skillCardRef: plan
    - name: javaee-to-quarkus
      skillCardRef: javaee-to-quarkus
    - name: house-rules
      skillCardRef: house-rules
