# Verify-stage Agent for the Java EE to Quarkus workflow.
#
# Referenced by the "verify" stage of the java-ee-to-quarkus AgentWorkflow.
# See agent_migration_plan.yaml for the omitted-gateways and execution notes —
# the same apply here.
apiVersion: konveyor.io/v1alpha1
kind: Agent
metadata:
  name: migration-verify-agent
  labels:
    app.kubernetes.io/managed-by: agentic-controller-defaults
spec:
  image: quay.io/konveyor/agent-java:latest
  skillCards:
    - ref: verify
  execution:
    maxTurns: 200
