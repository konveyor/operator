---
# Agentic controller operand tasks.
#
# The operator supplies Agent Sandbox unless an external controller is selected.
# Keep the CRD pre-flight for bring-your-own installations: a missing dependency
# is a soft status condition, not a failure of the whole Tackle reconcile.

- name: Reconcile Agent Sandbox controller
  import_tasks: agent-sandbox.yml

- name: Check for the Agent Sandbox CRD
  k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: sandboxes.agents.x-k8s.io
  register: agentic_sandbox_crd
  when: agentic_enabled | bool

- name: Determine Agent Sandbox CRD presence
  set_fact:
    agentic_sandbox_crd_present: "{{ agentic_enabled | bool and (agentic_sandbox_crd.resources | default([]) | length) > 0 }}"

- name: Set agentic controller deployment state
  set_fact:
    agentic_state: >-
      {{ 'present' if (agentic_enabled | bool and agentic_sandbox_crd_present | bool and
                      not agent_sandbox_resource_conflict | bool) else 'absent' }}

- name: Create agentic controller Deployment
  k8s:
    state: "{{ agentic_state }}"
    template: agentic/deployment.yaml.j2
    merge_type: merge

- name: Update agentic controller status conditions
  when: ansible_operator_meta is defined
  import_tasks: agentic-status.yml

- name: Update Agent Sandbox status condition
  when: ansible_operator_meta is defined
  import_tasks: agent-sandbox-status.yml
