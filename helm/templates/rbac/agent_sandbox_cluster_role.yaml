# Vendored from kubernetes-sigs/agent-sandbox v1.0.0 sandbox-with-extensions.yaml.
# RBAC names are prefixed to preserve a standalone upstream installation.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: konveyor-agent-sandbox-controller
rules:
- apiGroups:
  - ''
  resources:
  - persistentvolumeclaims
  - pods
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ''
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - agents.x-k8s.io
  resources:
  - sandboxes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - agents.x-k8s.io
  resources:
  - sandboxes/finalizers
  - sandboxes/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
