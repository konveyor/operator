---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - operator.openshift.io
  resources:
  - dnses
  verbs:
  - list
  - get
- apiGroups:
  - config.openshift.io
  resources:
  - clusterversions
  - proxies
  verbs:
  - get
- apiGroups:
  - keycloak.org
  - k8s.keycloak.org
  resources:
  - keycloaks
  - keycloakrealms
  - keycloakclients
  - keycloakusers
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - operators.coreos.com
  resources:
  - subscriptions
  - clusterserviceversions
  verbs:
  - get
  - list
  - watch
  - delete
# Read-only detection of the Agent Sandbox CRD for the agentic controller
# pre-flight (roles/tackle/tasks/agentic.yml). This is the operator's own
# detection permission, distinct from the agentic operand RBAC.
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - watch
#+kubebuilder:scaffold:rules
