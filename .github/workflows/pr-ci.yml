name: Pull Request CI

on:
  pull_request:
    branches:
      - main
      - 'release-*.*'

jobs:
  agentic-default-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install ansible-core==2.16.14 PyYAML
      - name: Test default content image resolution
        run: python3 -m unittest discover -s test/agentic -v

  detect-changes:
    runs-on: ubuntu-latest
    # Required permissions
    permissions:
      pull-requests: read
    # Set job outputs to values from filter step
    outputs:
      roles: ${{ steps.filter.outputs.roles }}
    steps:
    # For pull requests it's not necessary to checkout the code
    - uses: dorny/paths-filter@v2
      id: filter
      with:
        filters: |
          roles:
            - 'roles/**'

  ansible-lint:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.roles == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
      - name: Ansible Lint
        uses: ansible/ansible-lint@main
        with:
          setup_python: "false"
          working_directory: "roles/"

  build-operator-bundle:
    needs: detect-changes
    runs-on: ubuntu-latest
    env:
      IMG: ttl.sh/konveyor-operator-${{ github.sha }}:2h
      BUNDLE_IMG: ttl.sh/konveyor-operator-bundle-${{ github.sha }}:2h
    steps:
    - uses: actions/checkout@v4
    - run: make docker-build docker-push
    - run: make bundle bundle-build bundle-push


  run-ci:
    needs: build-operator-bundle
    uses: konveyor/ci/.github/workflows/global-ci-bundle.yml@main
    with:
      operator_bundle: ttl.sh/konveyor-operator-bundle-${{ github.sha }}:2h
      # Fetch tackle-k8s.yaml from the branch this PR targets (always a konveyor
      # org branch); github.head_ref would point at a fork and 404.
      ref: ${{ github.base_ref || github.ref_name }}
      run_koncur_hub_tests: true
      run_koncur_kantra_tests: true
